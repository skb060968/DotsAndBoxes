<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2c3e50">
  <title>Offline - Dots and Boxes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .offline-container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }

    .offline-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 28px;
    }

    p {
      color: #7f8c8d;
      margin-bottom: 30px;
      font-size: 16px;
      line-height: 1.6;
    }

    .btn {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #3498db;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn:hover {
      background: #2980b9;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .offline-features {
      margin-top: 40px;
      text-align: left;
      background: #ecf0f1;
      padding: 20px;
      border-radius: 8px;
    }

    .offline-features h3 {
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .offline-features ul {
      list-style-position: inside;
      color: #34495e;
    }

    .offline-features li {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e74c3c;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (max-width: 480px) {
      .offline-container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .offline-icon {
        font-size: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>
      <span class="status-indicator"></span>
      You're Offline
    </h1>
    <p>
      It looks like you've lost your internet connection. 
      To play Dots and Boxes multiplayer, you'll need to be online.
    </p>
    <button class="btn" onclick="location.reload()">
      🔄 Try Again
    </button>

    <div class="offline-features">
      <h3>About Dots and Boxes:</h3>
      <ul>
        <li>Classic two-player strategy game</li>
        <li>Real-time multiplayer gameplay</li>
        <li>Automatic matchmaking</li>
        <li>Works on mobile and desktop</li>
      </ul>
    </div>

    <script>
      // Check connection status periodically
      setInterval(() => {
        if (navigator.onLine) {
          location.reload();
        }
      }, 3000);

      // Listen for online event
      window.addEventListener('online', () => {
        location.reload();
      });
    </script>
  </div>
</body>
</html>
