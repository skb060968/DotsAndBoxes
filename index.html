<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667eea"><meta name="description" content="Play Dots and Boxes with friends."><title>Dots &amp; Boxes Multiplayer</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/style.css"></head>
<body><div class="app">
<section id="home" class="screen home" tabindex="-1" aria-labelledby="home-title"><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><defs><linearGradient id="brand-box-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient><radialGradient id="brand-dot-gradient" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.28" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></radialGradient></defs><rect class="brand-fill" x="20" y="20" width="60" height="60" rx="5"/><path class="brand-lines" d="M20 20H80V80H20Z"/><circle class="brand-dot" cx="20" cy="20" r="9"/><circle class="brand-dot" cx="80" cy="20" r="9"/><circle class="brand-dot" cx="20" cy="80" r="9"/><circle class="brand-dot" cx="80" cy="80" r="9"/></svg><h1 id="home-title">Dots <span>&amp;</span> Boxes</h1><p>Connect dots. Claim boxes. Win together.</p><div class="stack"><button id="home-host" class="button primary">HOST</button><button id="home-join" class="button secondary">Join as Player</button></div></section>
<section id="create-room" class="screen setup" tabindex="-1" hidden aria-labelledby="create-title"><h2 id="create-title">Create Room</h2><label for="create-name">Your name</label><input id="create-name" maxlength="16" autocomplete="name" required><fieldset><legend>Choose an avatar</legend><div class="picker avatar-picker" data-picker="create-avatar" role="group" aria-label="Avatar choices"></div></fieldset><fieldset><legend>Choose a color</legend><div class="picker color-picker" data-picker="create-color" role="group" aria-label="Color choices"></div></fieldset><button id="create-submit" class="button primary">Create</button><button data-home class="button quiet">← Back</button></section>
<section id="join-room" class="screen setup" tabindex="-1" hidden aria-labelledby="join-title"><h2 id="join-title">Join Room</h2><label for="join-code">Room code</label><input id="join-code" maxlength="6" inputmode="text" autocomplete="off" autocapitalize="characters" required><label for="join-name">Your name</label><input id="join-name" maxlength="16" autocomplete="name" required><fieldset><legend>Choose an avatar</legend><div class="picker avatar-picker" data-picker="join-avatar" role="group" aria-label="Avatar choices"></div></fieldset><fieldset><legend>Choose a color</legend><div class="picker color-picker" data-picker="join-color" role="group" aria-label="Color choices"></div></fieldset><button id="join-submit" class="button primary">Join</button><button data-home class="button quiet">← Back</button></section>
<section id="lobby" class="screen lobby" tabindex="-1" hidden aria-labelledby="lobby-title"><h2 id="lobby-title">Room Lobby</h2><p class="room-code">Code <strong id="lobby-code">DOTS66</strong></p><ul id="lobby-players" class="lobby-list" aria-label="Players"></ul><div class="share-row"><button id="share-code" class="button secondary">Share</button><button id="show-qr" class="button secondary">QR Code</button></div><button id="start-game" class="button primary">Start Game</button><button id="leave-lobby" class="button quiet">Leave Room</button></section>
<section id="gameplay" class="screen game" tabindex="-1" hidden aria-label="Dots and Boxes gameplay"><div id="player-cards" class="player-cards" aria-label="Players and scores"></div><div class="board-shell"><svg id="dots-board" class="dots-board" viewBox="0 0 100 180" role="group" aria-label="Dots and Boxes board with 6 columns and 11 rows"></svg></div><p id="game-message" class="game-message" aria-live="polite">Choose a dot to begin.</p><div class="game-controls"><label class="mute"><input id="mute" type="checkbox"><span id="mute-icon" aria-hidden="true">🔊</span><span>Mute</span></label><button id="end-game" class="end-game" type="button" title="End game" aria-label="End game" hidden>×</button></div></section>
<section id="results" class="screen results" tabindex="-1" hidden aria-labelledby="results-title"><h2 id="results-title">Game Complete</h2><div class="result-mark" aria-hidden="true">🏆</div><p id="result-summary">Great game!</p><button id="play-again" class="button primary">Play Again</button><button data-home class="button secondary">Home</button></section>
</div><dialog id="qr-dialog" aria-labelledby="qr-title"><h2 id="qr-title">Join this room</h2><img id="qr-image" width="240" height="240" alt="QR code for room link"><button id="close-qr" class="button secondary">Close</button></dialog><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="module" src="/src/main.js"></script></body></html>
